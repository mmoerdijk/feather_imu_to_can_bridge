pre-commit:
  parallel: true
  commands:
    clang-format:
      glob: "*.{c,h,cpp,hpp}"
      exclude: "(^|/)lsm6dsv_reg\\.(c|h)$" # vendored ST driver -- do not reformat
      run: clang-format -i {staged_files}
      stage_fixed: true
    ruff-format:
      glob: "*.py"
      run: ruff format {staged_files}
      stage_fixed: true
    ruff-check:
      glob: "*.py"
      run: ruff check --fix {staged_files}
      stage_fixed: true
