pre-commit:
  parallel: true
  commands:
    clang-format:
      glob: "*.{c,h,cpp,hpp}"
      # vendored ST driver -- do not reformat. `exclude` takes globs, not
      # regex (unlike `glob`, which supports {a,b} alternation).
      exclude:
        - "src/lsm6dsv_reg.c"
        - "include/lsm6dsv_reg.h"
      run: clang-format -i {staged_files}
      stage_fixed: true
    ruff-format:
      glob: "*.py"
      run: ruff format {staged_files}
      stage_fixed: true
    ruff-check:
      glob: "*.py"
      run: ruff check --fix {staged_files}
      stage_fixed: true
