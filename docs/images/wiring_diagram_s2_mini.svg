<svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    :root { color-scheme: light dark; }
    .bg { fill: #ffffff; }
    .board { fill: #eef2f7; stroke: #33415c; }
    .imu { fill: #f4f8ff; stroke: #33415c; }
    .text { fill: #1a2233; }
    .subtext { fill: #55607a; }
    .sda { stroke: #2f6fd6; }
    .scl { stroke: #d9822b; }
    .v33 { stroke: #d64545; }
    .gnd { stroke: #33415c; }
    .dot-sda { fill: #2f6fd6; }
    .dot-scl { fill: #d9822b; }
    .dot-v33 { fill: #d64545; }
    .dot-gnd { fill: #33415c; }
    .warn { fill: #7a3b00; }
    .warnbox { fill: #fff6e6; stroke: #d99a2b; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1b1f27; }
      .board { fill: #262c38; stroke: #9fb3d1; }
      .imu { fill: #202634; stroke: #9fb3d1; }
      .text { fill: #eef2f9; }
      .subtext { fill: #aab6cc; }
      .sda { stroke: #6ea0ff; }
      .scl { stroke: #f0a050; }
      .v33 { stroke: #ff7070; }
      .gnd { stroke: #b7c4dd; }
      .dot-sda { fill: #6ea0ff; }
      .dot-scl { fill: #f0a050; }
      .dot-v33 { fill: #ff7070; }
      .dot-gnd { fill: #b7c4dd; }
      .warn { fill: #ffcf87; }
      .warnbox { fill: #3a2f18; stroke: #d99a2b; }
    }
