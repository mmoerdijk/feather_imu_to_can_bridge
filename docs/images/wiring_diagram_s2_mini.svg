  <rect class="bg" x="0" y="0" width="960" height="640"/>
  <text class="text" x="480.0" y="28" font-size="20" font-weight="600" text-anchor="middle">S2 Mini test build — 2 I2C buses, 2 IMUs each</text>
  <text class="subtext" x="480.0" y="47" font-size="12" text-anchor="middle">a dot marks a connection; lines crossing without a dot are not connected</text>

  <rect class="board" x="30" y="75" width="175" height="480" rx="8" stroke-width="2"/>
  <text class="text" x="100" y="103" font-size="14" text-anchor="middle" font-weight="600">WEMOS LOLIN</text>
  <text class="text" x="100" y="121" font-size="14" text-anchor="middle" font-weight="600">S2 Mini</text>
  <text class="subtext" x="100" y="137" font-size="11" text-anchor="middle">ESP32-S2</text>
  <text class="subtext" x="197" y="139" font-size="11" text-anchor="end">3V3</text>
  <text class="subtext" x="197" y="164" font-size="11" text-anchor="end">GND</text>
  <line class="v33" x1="235" y1="135" x2="235" y2="375" stroke-width="2.5"/>
  <line class="gnd" x1="250" y1="160" x2="250" y2="397" stroke-width="2.5"/>
  <circle class="dot-v33" cx="235" cy="135" r="4.5"/>
  <circle class="dot-gnd" cx="250" cy="160" r="4.5"/>
  <line class="v33" x1="205" y1="135" x2="875" y2="135" stroke-width="2.5"/>
