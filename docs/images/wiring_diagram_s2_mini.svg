  <text class="subtext" x="465" y="510" font-size="10" text-anchor="middle">GND</text>
  <line class="gnd" x1="465" y1="397" x2="465" y2="494" stroke-width="2.5"/>
  <circle class="dot-gnd" cx="465" cy="397" r="4.5"/>
  <text class="subtext" x="505" y="510" font-size="10" text-anchor="middle">SDA</text>
  <line class="sda" x1="505" y1="432" x2="505" y2="494" stroke-width="2.5"/>
  <circle class="dot-sda" cx="505" cy="432" r="4.5"/>
  <text class="subtext" x="545" y="510" font-size="10" text-anchor="middle">SCL</text>
  <line class="scl" x1="545" y1="454" x2="545" y2="494" stroke-width="2.5"/>
  <circle class="dot-scl" cx="545" cy="454" r="4.5"/>
  <text class="subtext" x="585" y="510" font-size="10" text-anchor="middle">SA0</text>
  <line class="gnd" x1="585" y1="397" x2="585" y2="494" stroke-width="2.5"/>
  <circle class="dot-gnd" cx="585" cy="397" r="4.5"/>
  <text class="text" x="505.0" y="540" font-size="13" text-anchor="middle" font-weight="600">IMU2</text>
  <text class="subtext" x="505.0" y="558" font-size="11" text-anchor="middle">LSM6DSV · 0x6A (SA0 → GND)</text>
  <rect class="imu" x="680" y="494" width="210" height="80" rx="6" stroke-width="2"/>
  <text class="subtext" x="705" y="510" font-size="10" text-anchor="middle">3V3</text>
  <line class="v33" x1="705" y1="375" x2="705" y2="494" stroke-width="2.5"/>
  <circle class="dot-v33" cx="705" cy="375" r="4.5"/>
  <text class="subtext" x="745" y="510" font-size="10" text-anchor="middle">GND</text>
  <line class="gnd" x1="745" y1="397" x2="745" y2="494" stroke-width="2.5"/>
  <circle class="dot-gnd" cx="745" cy="397" r="4.5"/>
  <text class="subtext" x="785" y="510" font-size="10" text-anchor="middle">SDA</text>
  <line class="sda" x1="785" y1="432" x2="785" y2="494" stroke-width="2.5"/>
  <circle class="dot-sda" cx="785" cy="432" r="4.5"/>
  <text class="subtext" x="825" y="510" font-size="10" text-anchor="middle">SCL</text>
  <line class="scl" x1="825" y1="454" x2="825" y2="494" stroke-width="2.5"/>
  <circle class="dot-scl" cx="825" cy="454" r="4.5"/>
  <text class="subtext" x="865" y="510" font-size="10" text-anchor="middle">SA0</text>
  <line class="v33" x1="865" y1="375" x2="865" y2="494" stroke-width="2.5"/>
  <circle class="dot-v33" cx="865" cy="375" r="4.5"/>
  <text class="text" x="785.0" y="540" font-size="13" text-anchor="middle" font-weight="600">IMU3</text>
  <text class="subtext" x="785.0" y="558" font-size="11" text-anchor="middle">LSM6DSV · 0x6B (SA0 → 3V3)</text>
  <text class="subtext" x="42" y="300" font-size="11" text-anchor="start">GPIO15: onboard LED</text>
  <text class="subtext" x="42" y="316" font-size="11" text-anchor="start">(status, no wiring)</text>
  <text class="subtext" x="42" y="520" font-size="11" text-anchor="start">USB-C → PC</text>
  <text class="subtext" x="42" y="536" font-size="11" text-anchor="start">Serial, 115200 baud</text>
  <rect class="warnbox" x="30" y="585" width="900" height="42" rx="6" stroke-width="1.5"/>
  <text class="warn" x="45" y="602" font-size="11" text-anchor="start">ℹ Pull-ups come from the IMU boards — nothing to add on the S2 Mini. A bus with no IMU board has no pull-ups and reports “bus not ready”.</text>
  <text class="warn" x="45" y="618" font-size="11" text-anchor="start">ℹ SA0 sets the address (GND → 0x6A, 3V3 → 0x6B). Skip that wire if your IMU board already straps SA0 on-board. Power the IMUs from 3V3, not 5V/VBUS.</text>
</svg>
