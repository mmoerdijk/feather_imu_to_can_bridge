  <text class="subtext" x="197" y="226" font-size="11" text-anchor="end">GPIO8</text>
  <text class="subtext" x="42" y="215.0" font-size="11" text-anchor="start">bus 0 (Wire)</text>
  <text class="subtext" x="268" y="195" font-size="10" text-anchor="start">SDA0</text>
  <text class="subtext" x="268" y="236" font-size="10" text-anchor="start">SCL0</text>
