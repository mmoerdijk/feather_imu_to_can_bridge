  <circle class="dot-gnd" cx="465" cy="160" r="4.5"/>
  <text class="subtext" x="505" y="278" font-size="10" text-anchor="middle">SDA</text>
  <line class="sda" x1="505" y1="200" x2="505" y2="262" stroke-width="2.5"/>
  <circle class="dot-sda" cx="505" cy="200" r="4.5"/>
  <text class="subtext" x="545" y="278" font-size="10" text-anchor="middle">SCL</text>
  <line class="scl" x1="545" y1="222" x2="545" y2="262" stroke-width="2.5"/>
  <circle class="dot-scl" cx="545" cy="222" r="4.5"/>
