  <rect class="imu" x="400" y="494" width="210" height="80" rx="6" stroke-width="2"/>
  <text class="subtext" x="425" y="510" font-size="10" text-anchor="middle">3V3</text>
  <line class="v33" x1="425" y1="375" x2="425" y2="494" stroke-width="2.5"/>
