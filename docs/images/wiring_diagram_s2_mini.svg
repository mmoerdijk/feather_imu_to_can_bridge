  <circle class="dot-sda" cx="785" cy="200" r="4.5"/>
  <text class="subtext" x="825" y="278" font-size="10" text-anchor="middle">SCL</text>
  <line class="scl" x1="825" y1="222" x2="825" y2="262" stroke-width="2.5"/>
  <circle class="dot-scl" cx="825" cy="222" r="4.5"/>
  <text class="subtext" x="865" y="278" font-size="10" text-anchor="middle">SA0</text>
  <line class="v33" x1="865" y1="135" x2="865" y2="262" stroke-width="2.5"/>
  <circle class="dot-v33" cx="865" cy="135" r="4.5"/>
  <text class="text" x="785.0" y="308" font-size="13" text-anchor="middle" font-weight="600">IMU1</text>
  <text class="subtext" x="785.0" y="326" font-size="11" text-anchor="middle">LSM6DSV · 0x6B (SA0 → 3V3)</text>
  <line class="v33" x1="235" y1="375" x2="875" y2="375" stroke-width="2.5"/>
  <line class="gnd" x1="250" y1="397" x2="875" y2="397" stroke-width="2.5"/>
  <circle class="dot-v33" cx="235" cy="375" r="4.5"/>
  <circle class="dot-gnd" cx="250" cy="397" r="4.5"/>
  <line class="sda" x1="205" y1="432" x2="875" y2="432" stroke-width="2.5"/>
  <line class="scl" x1="205" y1="454" x2="875" y2="454" stroke-width="2.5"/>
  <text class="subtext" x="197" y="436" font-size="11" text-anchor="end">GPIO3</text>
  <text class="subtext" x="197" y="458" font-size="11" text-anchor="end">GPIO4</text>
