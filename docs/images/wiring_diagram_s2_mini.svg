  <text class="subtext" x="505.0" y="326" font-size="11" text-anchor="middle">LSM6DSV · 0x6A (SA0 → GND)</text>
  <rect class="imu" x="680" y="262" width="210" height="80" rx="6" stroke-width="2"/>
  <text class="subtext" x="705" y="278" font-size="10" text-anchor="middle">3V3</text>
  <line class="v33" x1="705" y1="135" x2="705" y2="262" stroke-width="2.5"/>
  <circle class="dot-v33" cx="705" cy="135" r="4.5"/>
  <text class="subtext" x="745" y="278" font-size="10" text-anchor="middle">GND</text>
  <line class="gnd" x1="745" y1="160" x2="745" y2="262" stroke-width="2.5"/>
