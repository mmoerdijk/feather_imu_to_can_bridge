; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:adafruit_feather_m4_can]
platform = atmelsam
board = adafruit_feather_m4_can
framework = arduino
monitor_speed = 115200
lib_deps = adafruit/Adafruit NeoPixel@^1.12.0
; Adafruit_NeoPixel.h has a guarded `#include <Adafruit_TinyUSB.h>` for
; boards using the TinyUSB stack. PlatformIO's LDF scans #includes as plain
; text and pulls that library in regardless of the surrounding #ifdef, even
; though we never define USE_TINYUSB -- exclude it, it doesn't build cleanly
; unless a USB stack is explicitly selected, which this project doesn't need.
lib_ignore = Adafruit TinyUSB Library
