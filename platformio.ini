; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Plain `pio run` / `pio run -t upload` target the S2 Mini only -- uploading
; to every env at once would try to flash both boards. Build the Feather with
; `pio run -e adafruit_feather_m4_can`.
default_envs = lolin_s2_mini

[env]
framework = arduino
monitor_speed = 115200

[env:lolin_s2_mini]
; pioarduino's fork of the platform (Arduino-ESP32 core 3.x); the official
; PlatformIO espressif32 platform is stuck on core 2.x.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.31-2/platform-espressif32.zip
board = lolin_s2_mini

[env:adafruit_feather_m4_can]
platform = atmelsam
board = adafruit_feather_m4_can
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
    adafruit/Adafruit CAN@^0.2.3
; Adafruit_NeoPixel.h has a guarded `#include <Adafruit_TinyUSB.h>` for
; boards using the TinyUSB stack. PlatformIO's LDF scans #includes as plain
; text and pulls that library in regardless of the surrounding #ifdef, even
; though we never define USE_TINYUSB -- exclude it, it doesn't build cleanly
; unless a USB stack is explicitly selected, which this project doesn't need.
lib_ignore = Adafruit TinyUSB Library
